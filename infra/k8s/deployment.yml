apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlops-aws-poc-api
  namespace: mlops-aws-poc
  labels:
    app.kubernetes.io/name: mlops-aws-poc-api
    app.kubernetes.io/part-of: mlops-aws-poc
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mlops-aws-poc-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mlops-aws-poc-api
        app.kubernetes.io/part-of: mlops-aws-poc
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: mlops-aws-poc:local
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: mlops-aws-poc-api-config
          volumeMounts:
            - name: model-artifact
              mountPath: /models/model.joblib
              subPath: model.joblib
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: model-artifact
          secret:
            secretName: mlops-aws-poc-model
            items:
              - key: model.joblib
                path: model.joblib
